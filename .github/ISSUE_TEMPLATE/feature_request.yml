name: Feature request
description: Suggest an improvement to Resume Generator
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and user experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you considered.
  - type: textarea
    id: agent_attribution
    attributes:
      label: Agent attribution (AI submissions only)
      description: If an AI agent prepared this issue, identify its actual provider, model, and harness.
      placeholder: |
        Agent provider: OpenAI
        Agent model: gpt-5.6-sol
        Agent harness: Codex
  - type: checkboxes
    id: impact
    attributes:
      label: Impact areas
      options:
        - label: This changes what user data is stored or sent to a service.
        - label: This adds or changes AI usage.
        - label: This adds a dependency or increases browser bundle size.
        - label: This affects Vercel deployment or serverless limits.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue or pull request covering this request.
          required: true
        - label: If an AI agent prepared this issue, I included its provider, model, and harness above.
          required: true
