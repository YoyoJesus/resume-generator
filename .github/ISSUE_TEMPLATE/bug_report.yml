name: Bug report
description: Report a reproducible problem with ResumeSmith
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove personal information from screenshots, documents, logs, and sample resumes.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear, concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Resume form
        - PDF preview or download
        - Resume upload or AI extraction
        - Custom Typst template
        - DOCX template conversion
        - O*NET tailoring
        - Deployment or configuration
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact API keys, resume contents, names, email addresses, and other personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched for an existing issue before filing this report.
          required: true
        - label: I removed credentials and personal resume data from this report.
          required: true
        - label: If an AI agent prepared this issue, I will include its provider, model, and harness below.
          required: true
  - type: textarea
    id: agent_attribution
    attributes:
      label: Agent attribution
      description: Enter the exact three-line footer for an AI submission. Otherwise enter "Not AI-generated".
      placeholder: |
        Agent provider: OpenAI
        Agent model: gpt-5.6-sol
        Agent harness: Codex
    validations:
      required: true
